server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Public URL is sub.uxo.kr/boomcompany. The same files are served at / (proxy strips the
  # prefix, also the container health check) and at /boomcompany/ (prefix passed through).
  location = /sw.js { add_header Cache-Control "no-store"; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache"; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }

  location = /boomcompany { return 301 /boomcompany/; }
  location = /boomcompany/sw.js { alias /usr/share/nginx/html/sw.js; add_header Cache-Control "no-store"; }
  location = /boomcompany/index.html { alias /usr/share/nginx/html/index.html; add_header Cache-Control "no-cache"; }
  location = /boomcompany/manifest.webmanifest { alias /usr/share/nginx/html/manifest.webmanifest; default_type application/manifest+json; add_header Cache-Control "no-cache"; }
  location ^~ /boomcompany/assets/ { alias /usr/share/nginx/html/assets/; add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location ^~ /boomcompany/ { alias /usr/share/nginx/html/; try_files $uri $uri/ /boomcompany/index.html; }
}
